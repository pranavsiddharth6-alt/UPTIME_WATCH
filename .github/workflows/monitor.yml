name: UptimeWatch monitoring

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '*/15 * * * *'

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run one monitoring pass
        shell: bash
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME || 'uptimewatch' }}
        run: |
          if [[ -z "${MONGODB_URI//[[:space:]]/}" ]]; then
            echo "::error::The MONGODB_URI Actions secret is required."
            exit 1
          fi
          python -B backend/monitor_worker.py
