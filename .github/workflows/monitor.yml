name: UptimeWatch monitoring

on:
  workflow_dispatch:
  # Enable only after an authorized manual run saves a check through Render.
  # Example: every 15 minutes (UTC).
  # schedule:
  #   - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: uptimewatch-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Trigger one monitoring dispatch on Render
        env:
          WORKER_TRIGGER_SECRET: ${{ secrets.WORKER_TRIGGER_SECRET }}
        run: python -B backend/trigger_monitor.py
