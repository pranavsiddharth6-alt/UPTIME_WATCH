name: UptimeWatch monitoring

on:
  workflow_dispatch:
  # Enable only after an authorized manual run saves a check through approved Atlas egress.
  # Example: every 15 minutes (UTC).
  # schedule:
  #   - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: uptimewatch-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run one monitoring pass
        shell: bash
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME || vars.MONGODB_DB_NAME || 'uptimewatch' }}
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          if [[ -z "${MONGODB_URI//[[:space:]]/}" ]]; then
            echo "::error::The MONGODB_URI Actions secret is required."
            exit 1
          fi
          python -B backend/monitor_worker.py
